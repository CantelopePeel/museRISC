<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc">
  <title id="title">museRISC</title>
  <desc id="desc">An original museRISC wordmark combining an M-shaped signal inside a processor package.</desc>

  <rect width="1080" height="340" rx="36" fill="#101923"/>

  <!-- Quiet board traces, kept subordinate to the mark. -->
  <g fill="none" stroke="#294154" stroke-width="2" opacity="0.55">
    <path d="M0 58 H76 L104 86 H150"/>
    <path d="M0 292 H84 L112 264 H172"/>
    <path d="M1080 66 H952 L922 96 H828"/>
    <path d="M1080 282 H930 L902 254 H814"/>
    <circle cx="104" cy="86" r="5" fill="#101923"/>
    <circle cx="922" cy="96" r="5" fill="#101923"/>
  </g>

  <!-- Processor pins. -->
  <g stroke="#57D0B8" stroke-width="10" stroke-linecap="round">
    <path d="M104 122 H72"/>
    <path d="M104 159 H72"/>
    <path d="M104 196 H72"/>
    <path d="M104 233 H72"/>
    <path d="M304 122 H336"/>
    <path d="M304 159 H336"/>
    <path d="M304 196 H336"/>
    <path d="M304 233 H336"/>
    <path d="M144 78 V48"/>
    <path d="M184 78 V48"/>
    <path d="M224 78 V48"/>
    <path d="M264 78 V48"/>
    <path d="M144 292 V262"/>
    <path d="M184 292 V262"/>
    <path d="M224 292 V262"/>
    <path d="M264 292 V262"/>
  </g>

  <!-- Chip body and M-shaped signal path. -->
  <rect x="104" y="78" width="200" height="184" rx="28" fill="#162231" stroke="#57D0B8" stroke-width="10"/>
  <path d="M142 218 V126 L204 192 L266 126 V218" fill="none" stroke="#F3F7F4" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="204" cy="192" r="11" fill="#F2B84B" stroke="#101923" stroke-width="4"/>

  <line x1="374" y1="82" x2="374" y2="258" stroke="#294154" stroke-width="2"/>

  <text x="416" y="168" font-family="Avenir Next, Futura, ui-sans-serif, system-ui, sans-serif" font-size="88" letter-spacing="-2">
    <tspan fill="#F3F7F4" font-weight="620">muse</tspan><tspan dx="10" fill="#57D0B8" font-weight="800">RISC</tspan>
  </text>
  <text x="420" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" letter-spacing="4.5" fill="#A9B9C4">RV64GCV · CRYPTO ACCELERATOR SOC</text>
  <path d="M420 248 H560" stroke="#F2B84B" stroke-width="5" stroke-linecap="round"/>
</svg>
