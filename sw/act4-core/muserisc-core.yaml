# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
# UDB architecture configuration for the museRISC in-house RV64
# core (issue #18), as of stage 4a (RV64IMA, M/S/U, Sv39+Svnapot,
# PMP16). DUT: rtl/core/muserisc_core.sv and friends running in
# the C++ Verilator harness (tb/cpp/core_tb.cpp ELF/HTIF mode,
# paged physical memory, boot_pc_i = ELF entry at 0x8000_0000).
# Every value below was read out of the RTL in this repository
# (citations name the file); the layout follows
# sw/act4-cva6/muserisc-cv64a6.yaml. Declared for the stage-3d
# I,M suites first; privileged suites are generated too
# (test_config include_priv_tests) and reported separately.
# One known deliberate imperfection, invisible to I/M but
# recorded here so priv results are read honestly:
# - Misaligned-vs-page-fault priority is misaligned-first
#   (detected in EX, translation in MEM); the param below keeps
#   the CVA6 value until a priv suite discriminates it.
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: muserisc-core
description: museRISC in-house RV64IM core (5-stage, Sv39) in the C++ Verilator harness

implemented_extensions:
  # misa is a read mux constant (writes WARL-ignored):
  # rtl/core/muserisc_csr.sv "12'h301: csr_rdata =
  # 64'h8000_0000_0014_1129"  (MXL=2, I, M, A, F, D, S, U).
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  # A via MEM-stage RMW on the combinational memory port
  # (muserisc_core.sv amo_result + reservation registers).
  - { name: A, version: "= 2.1.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  # F/D via rtl/core/muserisc_fpu.sv (combinational IEEE-754,
  # SoftFloat-checked in tb/cpp/fpu_tb.cpp); fcsr/frm/fflags
  # in muserisc_csr.sv, mstatus.FS writable + dirty-tracked.
  - { name: F, version: "= 2.2.0" }
  - { name: D, version: "= 2.2.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zifencei, version: "= 2.0.0" }

  # cycle/time/instret all readable; time mirrors cycle
  # (muserisc_csr.sv read cases 0xC00/0xC01/0xC02), gated by
  # mcounteren/scounteren below M.
  - { name: Zicntr, version: "= 2.0" }

  # Fetch and page-table walks read the same coherent harness
  # memory as data (no caches at all in this core).
  - { name: Ziccif, version: "= 1.0.0" }
  - { name: Ssccptr, version: "= 1.0.0" }

  # M/S/U implemented (muserisc_csr.sv priv_q + trap logic).
  - { name: U, version: "= 1.0.0" }
  - { name: S, version: "= 1.12.0" }
  # Sm 1.12: menvcfg (0x30A) and mconfigptr (0xF15) both decode.
  - { name: Sm, version: "= 1.12.0" }

  # satp MODE is WARL-clamped to Bare (0) or Sv39 (8) on write
  # (muserisc_csr.sv case 0x180).
  - { name: Sv39, version: "= 1.0.0" }
  - { name: Svbare, version: "= 1.0.0" }
  # Svnapot 64K leaves translate (muserisc_mmu.sv, N-bit path).
  - { name: Svnapot, version: "= 1.0.0" }
  # Svadu: the walker writes A/D back to the PTE in memory
  # (muserisc_mmu.sv W_UPD state); it never faults for A/D.
  - { name: Svadu, version: "= 1.0.0" }

  # stval/mtval always carry the faulting address (core wires
  # VA through to trap_tval_i); stvec has direct+vectored.
  - { name: Sstvala, version: "= 1.0.0" }
  - { name: Sstvecd, version: "= 1.0.0" }
  # (Sscounterenw is not claimed: UDB requires Zihpm, whose
  # unprivileged counter shadows this core does not provide.)
  # UXL is hardwired 2 (64-bit) in mstatus assembly.
  - { name: Ssu64xl, version: "= 1.0.0" }

  # Not implemented and deliberately absent: F, D, C (this
  # core is IALIGN=32; compressed is stage 5), B, V, H, Zihpm
  # (mhpmcounter3..31 decode as zero in M, their unprivileged
  # shadows trap, so the Zihpm contract is not met),
  # Svinval, Svpbmt, Sstc, Sdtrig, Zicbo*.

params:
  # Reservation covers exactly the LR access (4 or 8 bytes);
  # misaligned AMO/LR/SC trap like other accesses.
  LRSC_RESERVATION_STRATEGY: "reserve exactly enough to cover the access"
  MISALIGNED_AMO: false
  LRSC_MISALIGNED_BEHAVIOR: "always raise misaligned exception"
  # Reservation is tracked on physical addresses, so an SC
  # through a synonym VA succeeds; an SC smaller than the LR
  # but inside its range also succeeds (not exact-match only).
  LRSC_FAIL_ON_VA_SYNONYM: false
  LRSC_FAIL_ON_NON_EXACT_LRSC: false
  NON_STANDARD_EXTENSION_IMPLEMENTED: false
  # misa writes are ignored, so no misa bit is mutable.
  MUTABLE_MISA_A: false
  MUTABLE_MISA_M: false
  MUTABLE_MISA_U: false
  MUTABLE_MISA_S: false
  # FS fully writable, Dirty on FP-register writes (precise).
  MSTATUS_FS_LEGAL_VALUES: [0, 1, 2, 3]
  MUTABLE_MISA_F: false
  MUTABLE_MISA_D: false
  # Hardware sets FS to Dirty whenever an FP register is
  # written (muserisc_core.sv fp_dirty).
  HW_MSTATUS_FS_DIRTY_UPDATE: precise
  MSTATUS_VS_LEGAL_VALUES: [0]
  # The time CSR (0xC01) is readable (mirrors cycle).
  TIME_CSR_IMPLEMENTED: true

  # ---------------------------------------------------------------- U params
  U_MODE_ENDIANNESS: little
  # WFI is a NOP in every mode unless TW traps it
  # (muserisc_csr.sv sys_illegal case 3), so U-mode WFI is legal.
  WFI_U_MODE: true
  UXLEN: [64]
  TRAP_ON_ECALL_FROM_U: true

  # ---------------------------------------------------------------- S params
  # satp stores the full 16-bit ASID field unmasked.
  ASID_WIDTH: 16
  S_MODE_ENDIANNESS: little
  # SSIP/STIP/SEIP exist in mip/mie/mideleg (software bits plus
  # irq_s_timer_i / irq_s_ext_i pins, tied low unless the
  # directed harness drives them).
  SEI_INTR_IMPL: true
  SSI_INTR_IMPL: true
  STI_INTR_IMPL: true
  SXLEN: [64]
  REPORT_VA_IN_MTVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_PAGE_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_STVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_STVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_VA_IN_STVAL_ON_LOAD_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_STORE_AMO_PAGE_FAULT: true
  REPORT_VA_IN_STVAL_ON_INSTRUCTION_PAGE_FAULT: true
  # Illegal instructions always write the encoding to tval
  # (ID for decode-illegal, EX for CSR/sys via idex_instr_q).
  REPORT_ENCODING_IN_STVAL_ON_ILLEGAL_INSTRUCTION: true
  STVAL_WIDTH: 64
  # scounteren write mask is CY|TM|IR (muserisc_csr.sv 0x106).
  SCOUNTENABLE_EN:
    [
      true, true, true, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ]
  # stvec/mtvec: {base[63:2], mode} with modes 2/3 mapped to 0;
  # vectored target is base + 4*cause, so 4-byte alignment is
  # all the base needs.
  STVEC_MODES: [0, 1]
  STVEC_BASE_ALIGNMENT_VECTORED: 4
  SATP_MODE_BARE: true
  TRAP_ON_ECALL_FROM_S: true

  # ---------------------------------------------------------------- Sm params
  # ACT reads these as "the platform can raise it via rvmodel
  # macros"; the harness has no CLINT/PLIC devices for ACT
  # ELFs to poke, so all three are false here even though the
  # core's mie/mip bits and pins implement them.
  MEI_INTR_IMPL: false
  MSI_INTR_IMPL: false
  MTI_INTR_IMPL: false
  # WFI never waits (NOP), so it always resumes immediately.
  WFI_FINITE: true
  MXLEN: 64
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  # mvendorid reads 0; marchid = "MUSE" (0x4D555345), mimpid
  # = 0x00030000 (stage 3), mconfigptr = 0
  # (muserisc_csr.sv read cases 0xF11-0xF15).
  MARCHID_IMPLEMENTED: true
  ARCH_ID_VALUE: 1297246277
  MIMPID_IMPLEMENTED: true
  IMP_ID_VALUE: 196608
  VENDOR_ID_BANK: 0
  VENDOR_ID_OFFSET: 0
  CONFIG_PTR_ADDRESS: 0
  # Misaligned scalar loads/stores trap (EX alignment check);
  # no Zicclsm. Priority value kept from the CVA6 config for
  # now; ours is detected before translation (see header).
  MISALIGNED_LDST: false
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  TRAP_ON_ILLEGAL_WLRL: false
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: true
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  MTVAL_WIDTH: 64
  PMA_GRANULARITY: 12
  # Addresses are 56-bit physical (Sv39 PPN + PMP domain).
  PHYS_ADDR_WIDTH: 56
  M_MODE_ENDIANNESS: little
  MISA_CSR_IMPLEMENTED: true
  MTVEC_ACCESS: rw
  MTVEC_MODES: [0, 1]
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 4
  # Writes of mode 2/3 land as mode 0 (WARL ternary in the
  # mtvec/stvec write cases), not retained and not ignored.
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom
  # PMP: 16 entries, all usable, 4-byte grain (UDB granularity
  # is log2 of the grain in bytes), OFF/TOR/NA4/NAPOT all
  # decode (muserisc_csr.sv pmp_match).
  NUM_PMP_ENTRIES: 16
  PMP_GRANULARITY: 2
  NUM_USABLE_PMP_ENTRIES: 16
  PMP_NA4_SUPPORTED: true
  PMP_NAPOT_SUPPORTED: true
  PMP_TOR_SUPPORTED: true
  # No HPM counters count: mhpmcounter3..31 read zero in M.
  HPM_COUNTER_EN:
    [
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ]
  MCOUNTINHIBIT_IMPLEMENTED: true
  # mcountinhibit write mask is CY|IR (0x320 case).
  COUNTINHIBIT_EN:
    [
      true, false, true, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ]
  # mcounteren write mask is CY|TM|IR (0x306 case).
  MCOUNTENABLE_EN:
    [
      true, true, true, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ]
